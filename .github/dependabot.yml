version: 2

# Dependency updates land on development like any other change, never straight on main.
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Type definitions must match the Node version we run (22). Newer majors describe APIs that don't exist there.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: monthly
