# Single-package repo. This file only exists to configure pnpm.
autoInstallPeers: true
strictPeerDependencies: false

# Packages allowed to run install scripts (Prisma downloads its engines; esbuild its binary).
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  esbuild: true
  sharp: true
  unrs-resolver: true
